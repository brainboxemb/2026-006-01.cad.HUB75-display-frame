name: Render OpenSCAD V1.1 PNGs

on:
  workflow_dispatch:
  push:
    paths:
      - "cad/v1.1/**"
      - ".github/workflows/render-openscad-v1.1.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Render documentation PNGs
        run: |
          bash cad/v1.1/scripts/render_pngs.sh out/v1.1/png

      - name: Commit updated renders
        env:
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git add out/v1.1/png/

          if git diff --cached --quiet; then
            echo "No render changes to commit."
            exit 0
          fi

          git commit -m "Update V1.1 OpenSCAD renders"
          git push
